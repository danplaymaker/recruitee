[project]
name = "trapline"
version = "0.1.0"
description = "Value-betting system for UK & Irish greyhound racing."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "trapline" }]

dependencies = [
    "lightgbm>=4.3",
    "pandas>=2.2",
    "polars>=1.0",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "selectolax>=0.3.21",
    "betfairlightweight>=2.20",
    "optuna>=3.6",
    "typer>=0.12",
    "rich>=13.7",
    "structlog>=24.1",
    "rapidfuzz>=3.9",
    "pyyaml>=6.0",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-pyyaml",
    "types-python-dateutil",
]

[project.scripts]
trapline = "trapline.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trapline"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle / pyflakes
    "I",             # isort
    "B",             # bugbear
    "UP",            # pyupgrade
    "SIM",           # simplify
    "RUF",           # ruff-specific
    "N",             # naming
    "PL",            # pylint
    "PT",            # pytest style
    "TID",           # tidy imports
]
ignore = [
    "PLR0913",  # too many args (model fns legitimately have many features)
    "PLR2004",  # magic-value-comparison (race domain has natural constants)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "S101"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/trapline"]
plugins = []
warn_unused_ignores = true
warn_return_any = true
warn_redundant_casts = true
show_error_codes = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = [
    "lightgbm.*",
    "betfairlightweight.*",
    "selectolax.*",
    "optuna.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "integration: end-to-end tests that touch the DB or filesystem",
    "slow: tests that take more than ~1s",
]

[tool.coverage.run]
source = ["src/trapline"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
